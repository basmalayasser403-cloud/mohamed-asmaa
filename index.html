<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation | Mohamed & Asmaa</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            background: #fff;
        }

        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=1600&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            filter: blur(8px) brightness(0.95);
            transform: scale(1.05);
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.45);
            z-index: -1;
        }

        /* قلوب مفرغة أنيقة وشيك */
        .heart {
            position: fixed;
            top: -10vh;
            color: #d81b60;
            font-size: 20px;
            user-select: none;
            z-index: 1;
            animation: fall linear infinite;
            filter: drop-shadow(0 2px 5px rgba(216, 27, 96, 0.3));
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.7);
                opacity: 0;
            }
            15% {
                opacity: 0.95;
            }
            100% {
                transform: translateY(105vh) rotate(360deg) scale(1.3);
                opacity: 0;
            }
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 40px 25px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 500px;
            width: 90%;
            z-index: 10;
            animation: cardAppear 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .header-title {
            font-size: 1.1rem;
            color: #666;
            font-weight: 400;
            margin-bottom: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .names {
            font-family: 'Playfair Display', serif;
            font-size: 2.6rem;
            color: #9d3148;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(157, 49, 72, 0.15);
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #b76e79, transparent);
            margin: 0 auto 20px auto;
        }

        .details {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #444;
            margin-bottom: 25px;
            font-weight: 400;
        }

        .details strong {
            color: #111;
            font-weight: 600;
        }

        .badge {
            display: block;
            background: rgba(183, 110, 121, 0.12);
            color: #9d3148;
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            margin-top: 15px;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid rgba(183, 110, 121, 0.25);
        }

        .badge:hover {
            background: rgba(183, 110, 121, 0.22);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(157, 49, 72, 0.15);
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.7);
            padding: 10px 12px;
            border-radius: 12px;
            min-width: 65px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            border: 1px solid rgba(183, 110, 121, 0.2);
        }

        .time-box span {
            display: block;
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: #9d3148;
        }

        .time-box label {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .footer-note {
            font-size: 0.95rem;
            color: #777;
            border-top: 1px solid rgba(0,0,0,0.06);
            padding-top: 15px;
            font-style: italic;
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>
    <div class="overlay"></div>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            const hearts = ['♥', '♡', '❤', '❦'];
            heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            heart.style.fontSize = (Math.random() * 14 + 14) + 'px';
            document.body.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 7000);
        }
        setInterval(createHeart, 300);

        const weddingDate = new Date("November 16, 2026 20:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const gap = weddingDate - now;

            const second = 1000;
            const minute = second * 60;
            const hour = minute * 60;
            const day = hour * 24;

            const d = Math.floor(gap / day);
            const h = Math.floor((gap % day) / hour);
            const m = Math.floor((gap % hour) / minute);
            const s = Math.floor((gap % minute) / second);

            document.getElementById("days").innerText = d < 10 ? "0" + d : d;
            document.getElementById("hours").innerText = h < 10 ? "0" + h : h;
            document.getElementById("minutes").innerText = m < 10 ? "0" + m : m;
            document.getElementById("seconds").innerText = s < 10 ? "0" + s : s;
        }

        setInterval(updateCountdown, 1000);
    </script>

    <div class="container">
        <div class="header-title">Together with their families</div>
        
        <div class="names">Mohamed & Asmaa</div>
        
        <div class="divider"></div>
        
        <div class="details">
            Invite you to celebrate their wedding on<br>
            <strong>Monday, November 16, 2026</strong><br>
            at <strong>8:00 PM</strong><br>
            <a href="https://maps.app.goo.gl/95a5VwF7LzT4b5c77" target="_blank" class="badge">
                📍 Reval Hall - Engineers Club, Old Damietta (View on Map)
            </a>
        </div>

        <div class="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <label>Days</label>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <label>Hours</label>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <label>Mins</label>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <label>Secs</label>
            </div>
        </div>
        
        <div class="footer-note">
            Your presence will make our day complete ✨
        </div>
    </div>

</body>
</html>
