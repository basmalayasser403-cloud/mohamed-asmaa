<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation | Mohamed & Asmaa</title>
    <!-- خطوط راقية جداً للعربي والإنجليزي -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            background: #fff;
        }

        /* خلفية الفرح الرقيقة الملموسة بالبلور */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=1600&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            filter: blur(8px) brightness(0.95);
            transform: scale(1.05); /* عشان يلغي أطراف البلور */
            z-index: -2;
        }

        /* طبقة حماية فاتحة فوق الخلفية لتناسق الألوان */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.45);
            z-index: -1;
        }

        /* القلوب المتساقطة الرقيقة */
        .heart {
            position: fixed;
            top: -10vh;
            color: #e91e63;
            user-select: none;
            z-index: 1;
            animation: fall linear infinite;
            filter: drop-shadow(0 2px 4px rgba(233, 30, 99, 0.2));
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(105vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        /* كارت الدعوة التفاعلي بالتأثير الزجاجي */
        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 45px 25px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 480px;
            width: 90%;
            z-index: 10;
            animation: cardAppear 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .header-title {
            font-size: 1.25rem;
            color: #666;
            font-weight: 500;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        /* الأسماء بالإنجليزي بخط ملوكي */
        .names {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            color: #9d3148;
            font-weight: 600;
            margin-bottom: 25px;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(157, 49, 72, 0.15);
            animation: pulseNames 3s ease-in-out infinite alternate;
        }

        @keyframes pulseNames {
            from { transform: scale(1); }
            to { transform: scale(1.03); }
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #b76e79, transparent);
            margin: 0 auto 25px auto;
        }

        .details {
            font-size: 1.15rem;
            line-height: 2;
            color: #444;
            margin-bottom: 30px;
        }

        .details strong {
            color: #111;
            font-weight: 700;
        }

        .badge {
            display: inline-block;
            background: rgba(183, 110, 121, 0.12);
            color: #9d3148;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            margin-top: 10px;
        }

        .footer-note {
            font-size: 1rem;
            color: #777;
            border-top: 1px solid rgba(0,0,0,0.06);
            padding-top: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>
    <div class="overlay"></div>

    <!-- كود تساقط القلوب التفاعلي -->
    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            const hearts = ['❤️', '💖', '💕', '✨'];
            heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            heart.style.fontSize = (Math.random() * 12 + 14) + 'px';
            document.body.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 7000);
        }
        setInterval(createHeart, 350);
    </script>

    <div class="container">
        <div class="header-title">يتشرفان بدعوتكم لحضور حفل الزفاف</div>
        
        <div class="names">Mohamed & Asmaa</div>
        
        <div class="divider"></div>
        
        <div class="details">
            وذلك بمشيئة الله تعالى يوم <strong>الإثنين 16 نوفمبر 2026</strong><br>
            في تمام الساعة <strong>8:00 مساءً</strong><br>
            <div class="badge">📍 قاعة ريفال - نادي المهندسين، دمياط القديمة</div>
        </div>
        
        <div class="footer-note">
            حضوركم يسعدنا وتكتمل به فرحتنا ✨
        </div>
    </div>

</body>
</html>
